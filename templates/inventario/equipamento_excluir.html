{% extends "base.html" %}
{% block titulo %}Excluir equipamento — StockLink{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card shadow-sm border-danger"><div class="card-body">
      <h5 class="text-danger">Excluir equipamento</h5>
      <p>Tem certeza que deseja remover <strong>{{ equipamento }}</strong>?
         Esta ação não pode ser desfeita e apagará também seu histórico.</p>
      <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger">Sim, excluir</button>
        <a href="{% url 'equipamento_detalhe' equipamento.pk %}" class="btn btn-outline-secondary">Cancelar</a>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
